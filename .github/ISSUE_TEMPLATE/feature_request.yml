name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that Ganttee does not let you do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Describe the expected user interaction.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds that you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chart (timeline)
        - Tasks view
        - Edit forms
        - Project settings
        - Scheduling
        - Other
    validations:
      required: true
