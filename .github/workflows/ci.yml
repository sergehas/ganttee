name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"

jobs:
  # ── 1. Type-check and lint ─────────────────────────────────────────────────
  quality:
    name: Quality (type-check + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run check-types

      - run: npm run lint

  # ── 2. Build both bundles ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: node esbuild.js

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ── 3. Integration tests (plain Node, no VS Code runtime) ──────────────────
  test-integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: npm run compile-tests

      - run: npm run test:integration

  # ── 4. VS Code tests (unit + smoke, requires a display) ───────────────────
  test-vscode:
    name: VS Code tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: npm run compile-tests

      # Linux run also collects coverage so the branch-coverage gate doesn't need its own unit-test run.
      - name: Run unit tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:unit:coverage

      # continue-on-error keeps later steps (smoke tests) running; the final gate step below fails the job.
      - name: Check branch coverage (Linux)
        id: coverage-check
        if: runner.os == 'Linux'
        continue-on-error: true
        run: node scripts/check-coverage.mjs

      - name: Upload coverage report (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:unit

      - name: Run smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke

      - name: Run smoke tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:smoke

      - name: Fail job if branch coverage was below threshold (Linux)
        if: runner.os == 'Linux' && steps.coverage-check.outcome == 'failure'
        run: exit 1
