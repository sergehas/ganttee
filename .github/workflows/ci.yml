name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"

jobs:
  # ── 1. Dependency vulnerability audit ──────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm audit --audit-level=high

  # ── 2. Type-check and lint ─────────────────────────────────────────────────
  quality:
    name: Quality (type-check + format:check + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run check-types

      - run: npm run format:check

      - run: npm run lint

  # ── 3. Build both bundles ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: node esbuild.js

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/

  # ── 4. Integration tests (plain Node, no VS Code runtime) ──────────────────
  test-integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dist
          path: dist/

      - run: npm run compile-tests

      - run: npm run test:integration

  # ── 5. VS Code tests (unit + smoke, requires a display) ───────────────────
  test-vscode:
    name: VS Code tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dist
          path: dist/

      - run: npm run compile-tests

      # Bound cache staleness to a day since the "insiders" build changes frequently.
      - name: Compute cache key date
        id: cache-date
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code test download
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-insiders-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            vscode-test-${{ runner.os }}-insiders-

      # Linux run also collects coverage so the branch-coverage gate doesn't need its own unit-test run.
      - name: Run unit tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:unit:coverage

      # continue-on-error keeps later steps (smoke tests) running; the final gate step below fails the job.
      - name: Check branch coverage (Linux)
        id: coverage-check
        if: runner.os == 'Linux'
        continue-on-error: true
        run: node scripts/check-coverage.mjs

      - name: Upload coverage report (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:unit

      # Smoke tests spin up a full extension host; retry once to absorb transient flakiness.
      - name: Run smoke tests (Linux)
        if: runner.os == 'Linux'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: xvfb-run -a npm run test:smoke

      - name: Run smoke tests (Windows)
        if: runner.os == 'Windows'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 2
          shell: pwsh
          command: npm run test:smoke

      - name: Fail job if branch coverage was below threshold (Linux)
        if: runner.os == 'Linux' && steps.coverage-check.outcome == 'failure'
        run: exit 1
