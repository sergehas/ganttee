name: Release

# Step 2 of the gitflow release: run on `main` after the release PR is merged.
# The released VSIX remains tied to the tag, not the subsequent development bump.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Set RELEASE_TOKEN to an admin-owned token before releasing."
            exit 1
          fi

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the main branch (current: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Read version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check publisher and tag
        id: tag-check
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be stable X.Y.Z; found $VERSION."
            exit 1
          fi
          publisher="$(node -p "require('./package.json').publisher")"
          if [ "$publisher" = "tbd-publisher" ]; then
            echo "::error::Set the Marketplace publisher ID in package.json before releasing."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG"
            tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG exists but does not point to this workflow's commit."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Package VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run vsix -- --out "ganttee-$VERSION.vsix"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-changelog.mjs notes "$VERSION" > release-notes.md

      - name: Create tag
        if: steps.tag-check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # GITHUB_TOKEN on purpose: its release event does not trigger publish.yml, the publish job below does.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="ganttee-$VERSION.vsix"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release upload "$TAG" "$asset"
            fi
          else
            gh release create "$TAG" "$asset" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

  development-bump:
    name: Bump next development version and open PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Set RELEASE_TOKEN to an admin-owned token before creating the development bump PR."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit next development version and push branch if needed
        id: development
        run: |
          npm version preminor --preid dev --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          branch="release/$version"
          git switch -c "$branch"
          git add package.json package-lock.json
          git -c core.hooksPath=/dev/null commit -m "chore(release): start $version development"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_version="$(git show "origin/$branch:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            if [ "$remote_version" != "$version" ]; then
              echo "::error::Existing branch $branch has version $remote_version, expected $version."
              exit 1
            fi
          else
            git push origin "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open development bump pull request to main if needed
        env:
          BRANCH: ${{ steps.development.outputs.branch }}
        run: |
          existing="$(gh pr list --repo "$GH_REPO" --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): start ${BRANCH#release/} development" \
              --body "Development version after release. Release follow-up merges this PR after CI succeeds, then opens the back-merge into develop."
          fi

  publish:
    name: Publish to Marketplace
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
