name: Publish

# Publishes the VSIX attached to a GitHub Release to the VS Code Marketplace, unchanged.
# Marketplace trusted publishing uses GitHub OIDC; the environment retains the approval gate.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        type: string
        required: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish VSIX
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    environment: marketplace
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag \"$TAG\". Expected vX.Y.Z."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download VSIX from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern "*.vsix" --dir vsix

      - name: Publish to Marketplace
        run: |
          shopt -s nullglob
          files=(vsix/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .vsix asset on release $TAG, found ${#files[@]}."
            exit 1
          fi
          npm run vsce -- publish --packagePath "${files[0]}" --oidc
